name: CI

on:
  push:
    branches: [main]
  pull_request:

# The runner image is PINNED (not ubuntu-latest): an OS upgrade under the build is a decision to
# make on purpose, in a PR of its own, not something that lands silently on a Monday.
jobs:
  back:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: back
      - run: npx tsc --noEmit
        working-directory: back
      - run: npm test
        working-directory: back

  front:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: front
      - run: npm run build
        working-directory: front
      - run: npm test
        working-directory: front
