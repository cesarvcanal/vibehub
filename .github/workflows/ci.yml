name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: back
      - run: npx tsc --noEmit
        working-directory: back
      - run: npm test
        working-directory: back

  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: front
      - run: npm run build
        working-directory: front
      - run: npm test
        working-directory: front
