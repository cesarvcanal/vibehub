<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `maximum-scale=1` is not a "no pinch zoom" decision, it is the iOS keyboard fix: Safari zooms
      the whole page when a focused field has a font smaller than 16px, and it never zooms back out.
      Every field in the card view is 16px on a phone, and this stops the reflow that made the
      terminal unreadable the moment the keyboard came up. `viewport-fit=cover` lets the layout run
      under the home indicator, which is what `100dvh` measures against.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>vibehub</title>
    <meta
      name="description"
      content="A self-hosted kanban of live AI coding agent terminals, running in containers on your own server."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c0f'/%3E%3Cpath d='M8 11l5 5-5 5' stroke='%232596f4' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 21h7' stroke='%232596f4' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Paint the right background before React mounts so a reload never flashes the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("vibehub.theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (_) {
          /* storage can throw in private mode — the CSS default covers us */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
